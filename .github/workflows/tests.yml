name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install -r tests/requirements-native.txt
          npm ci --prefix tests
      - name: Compile
        run: python -m compileall -q custom_components
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Card smoke test
        run: node tests/smoke.cjs
      - name: Firefox 68 compatibility
        run: node tests/legacy_browser.cjs
